name: PetSync Automated Adoption Sync

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  sync_pets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: cron/package-lock.json

      - name: Install Cron Dependencies
        run: |
          cd cron
          npm ci

      - name: Run PetSync to JSON
        env:
          PETANGO_AUTHKEY: ${{ secrets.PETANGO_AUTHKEY || '40fm1dbi1t4267edhjlafrfmbgfqfvmi0vjjm3iori7pxqk8xp' }}
          PUBLIC_SITE_URL: 'https://monroe-humane.org'
        run: |
          cd cron
          npx tsx src/sync-to-json.ts

      - name: Commit Updated Pet Data
        run: |
          # Check if shelter-pets.json or archived-pets.json changed
          if git diff --quiet frontend/src/data/shelter-pets.json frontend/public/shelter-pets.json frontend/src/data/archived-pets.json; then
            echo "No changes in pet adoption records. Skipping commit."
          else
            echo "Changes detected in pet records. Committing and pushing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add frontend/src/data/shelter-pets.json frontend/public/shelter-pets.json frontend/src/data/archived-pets.json
            git commit -m "chore(petsync): update adoptable pet records from Petango"
            git push
          fi
