name: Deploy Astro Frontend to GitHub Pages (Production)

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  repository_dispatch:
    types: [cms_rebuild]
  schedule:
    # Daily rebuild at 03:00 UTC so pet listings and dynamic data stay fresh
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Game JS syntax check
        run: |
          cd frontend
          fail=0
          while IFS= read -r f; do
            if ! node --check "$f"; then fail=1; fi
          done < <(find public/games -name '*.js' -type f)
          exit $fail

      - name: Typecheck Astro Site
        run: |
          cd frontend
          npm run check

      - name: Compile and Encrypt Financial Vault
        run: |
          # Raw financial JSONs are gitignored (confidential board/donor data).
          # When they are present (local run or secret-injected), recompile the vault.
          # In standard CI the committed financials.enc.json is used as-is.
          if [ -f api/data/published_2026_ytd.json ]; then
            echo "Source data found — recompiling vault..."
            node scripts/compile_financial_vault.cjs
          else
            echo "Source data not present in CI — using committed vault."
          fi

      - name: Verify Financial Vault Cryptographic Integrity
        run: |
          node scripts/verify_financial_vault.cjs

      - name: Build Astro Static Site
        run: |
          cd frontend
          npm run build

      - name: Deploy to gh-pages branch (Direct Branch Hosting)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
          cname: monroe-humane.org

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
