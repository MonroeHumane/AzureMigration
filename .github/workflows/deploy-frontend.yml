name: Deploy Astro Frontend to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'api/**'
      - '.github/workflows/deploy-frontend.yml'
  # Fires when Directus posts to /api/pet-sync-webhook, which dispatches this event
  repository_dispatch:
    types: [cms_rebuild]
  # Safety-net: rebuild every night at 3 AM UTC so pet data never drifts more than 24h
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:


jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Install API Dependencies
        run: |
          cd api
          npm ci

      - name: Type Check
        run: |
          cd frontend
          npm run check

      - name: Build Astro Static Site
        run: |
          cd frontend
          npm run build

      # Required Azure SWA application setting (not a GitHub secret):
      #   STAFF_AUTH_SECRET — HMAC key for staff session tokens.
      #   /api/login, /api/session, /api/financials, and /api/statement fail closed
      #   with 503 if this setting is missing or empty. Generate a long random value
      #   and set it once; do not commit the value.
      #   az staticwebapp appsettings set -g MCHS-Platform-RG -n mchs-frontend-prod --setting-names STAFF_AUTH_SECRET=<generated>
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'frontend/dist'
          api_location: 'api'
          skip_app_build: true
