name: Build and Deploy Containers to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'arcade/**'
      - 'cron/**'
      - '.github/workflows/deploy-containers.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/monroe-humane

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: directus
            context: ./backend
          - name: arcade
            context: ./arcade
          - name: petsync
            context: ./cron

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:latest

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Directus to Azure Container Apps
        uses: azure/container-apps-deploy-action@v3
        with:
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-directus:latest
          containerAppName: mchs-directus
          resourceGroup: MCHS-Platform-RG

      - name: Deploy Arcade to Azure Container Apps
        uses: azure/container-apps-deploy-action@v3
        with:
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-arcade:latest
          containerAppName: mchs-arcade-api
          resourceGroup: MCHS-Platform-RG
