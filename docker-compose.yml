# Local-only stack. Copy .env.example to .env, then `docker compose up`.
# Defaults below are clearly local-only — never use them in Azure.

services:
  mysql:
    image: mariadb:11
    container_name: monroe-mysql
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - monroe-network

  directus:
    image: directus/directus:11.5.0
    container_name: monroe-directus
    restart: unless-stopped
    ports:
      - "8055:8055"
    depends_on:
      - mysql
    env_file:
      - path: .env
        required: false
    environment:
      KEY: ${DIRECTUS_KEY:-local-only-directus-key-not-for-prod}
      SECRET: ${DIRECTUS_SECRET:-local-only-directus-secret-not-for-prod}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@monroe-humane.org}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-local-only-AdminPass123!}
      DB_CLIENT: "mysql"
      DB_HOST: "mysql"
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DIRECTUS_NAME:-directus_db}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASS:-root}
      PUBLIC_URL: ${DIRECTUS_URL:-http://localhost:8055}
      CORS_ENABLED: "true"
      CORS_ORIGIN: ${DIRECTUS_CORS_ORIGIN:-http://localhost:4321,http://localhost:5173,http://localhost:8060,http://localhost:3000}
      STORAGE_LOCATIONS: "local"
      STORAGE_LOCAL_DRIVER: "local"
      STORAGE_LOCAL_ROOT: "/directus/uploads"
    volumes:
      - directus-uploads:/directus/uploads
    networks:
      - monroe-network

  arcade-api:
    build:
      context: ./arcade
      dockerfile: Dockerfile
    container_name: monroe-arcade-api
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - mysql
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: "mysql"
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:-root}
      DB_NAME: ${DB_ARCADE_NAME:-arcade_db}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4321,http://localhost:5173,http://localhost:8060,http://localhost:3000}
      CLEANUP_SECRET: ${CLEANUP_SECRET:-local-only-cleanup-secret-not-for-prod}
    volumes:
      - ./arcade:/var/www/html
    networks:
      - monroe-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: monroe-frontend
    restart: unless-stopped
    ports:
      - "4321:4321"
    depends_on:
      - directus
      - arcade-api
    env_file:
      - path: .env
        required: false
    environment:
      DIRECTUS_URL: "http://directus:8055"
      ARCADE_API_BASE: ${ARCADE_API_BASE:-http://localhost:8081/v1}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - monroe-network

  petsync:
    build:
      context: ./cron
      dockerfile: Dockerfile
    container_name: monroe-petsync
    restart: "no"
    depends_on:
      - directus
    env_file:
      - path: .env
        required: false
    environment:
      DIRECTUS_URL: "http://directus:8055"
      DIRECTUS_STATIC_TOKEN: ${DIRECTUS_STATIC_TOKEN:-admin-static-token}
      GOOGLE_SHEET_CSV_URL: ${GOOGLE_SHEET_CSV_URL:-}
      PETANGO_AUTHKEY: ${PETANGO_AUTHKEY:-}
    networks:
      - monroe-network

networks:
  monroe-network:
    driver: bridge

volumes:
  mysql-data:
  directus-uploads:
