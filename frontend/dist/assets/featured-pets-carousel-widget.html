<!-- Featured Pets Carousel Widget (bundled for animal search / featured_pets) -->
<!-- Styles live in assets/home-embed-widgets.css (#featuredPetsWidget) so they are
     cached, not re-shipped in the homepage HTML on every request. Data comes from
     the server-side REST feed (/monroe/v1/featured-pets), unifying the homepage
     carousel with adopt search and the Humane Games - no client CSV / PapaParse. -->
<div id="featuredPetsWidget" data-monroe-defer-carousel="1" data-rest-url="%MONROE_FEATURED_PETS_REST_URL%">
  <div class="fpw-toolbar">
    <button type="button" class="fpw-expand-btn" id="fpwExpandBtn" aria-expanded="false" aria-controls="featuredPetsFsDialog">
      Expand view
    </button>
  </div>
  <dialog id="featuredPetsFsDialog" class="fpw-fs-dialog" aria-labelledby="fpwFsTitle">
    <div class="fpw-fs-inner">
      <div class="fpw-fs-header">
        <h2 id="fpwFsTitle">Adoptable Pets</h2>
        <button type="button" class="fpw-fs-close">Close</button>
      </div>
      <div class="fpw-fs-body">
        <section class="fpw-fs-section" aria-label="Longest residents">
          <h3>Longest residents</h3>
          <div id="fpw-fs-longest"></div>
        </section>
      </div>
    </div>
  </dialog>
  <div class="widget-section">
    <div class="widget-title widget-title--with-cta">
      <span>Longest residents</span>
      <a class="adopt-all-btn" href="/adopt/" rel="noopener noreferrer">Search All Adoptable Pets</a>
    </div>
    <div class="widget-grid" id="longestRow">%MONROE_FEATURED_PETS_INITIAL_ROW%</div>
  </div>
  <script>
    (function () {
      const MOBILE_MQ = "(max-width: 768px)";
      const MAX_TO_SHOW = 12;

      let cachedLongest = null;
      let cachedLongestFull = null;

      function widgetRoot() {
        return document.getElementById("featuredPetsWidget");
      }
      function restUrl() {
        var root = widgetRoot();
        var url = root ? root.getAttribute("data-rest-url") : "";
        return url && url.indexOf("%MONROE") !== 0 ? url : "/wp-json/monroe/v1/featured-pets";
      }

      function shouldUseInfiniteMarquee() {
        if (typeof window.matchMedia !== "function") return true;
        if (window.matchMedia(MOBILE_MQ).matches) return false;
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return false;
        return true;
      }

      function makeCard(pet) {
        const name = (pet.name || "No Name").trim() || "No Name";
        const speciesRaw = pet.species || "Pet";
        const profileURL = pet.url || "#";
        const card = document.createElement("a");
        card.className = "pet-card-widget";
        card.href = profileURL;
        card.target = "_blank";
        card.rel = "noopener noreferrer";
        card.setAttribute("aria-label", name + " the " + (speciesRaw ? speciesRaw.toLowerCase() : "pet"));
        if (pet.is_new) {
          const newBadge = document.createElement("div");
          newBadge.className = "badge";
          newBadge.textContent = "New";
          card.appendChild(newBadge);
        }
        if (pet.is_long) {
          const longBadge = document.createElement("div");
          longBadge.className = "badge secondary";
          longBadge.textContent = "Longtimer";
          card.appendChild(longBadge);
        }
        const photoShell = document.createElement("div");
        photoShell.className = "photo-shell";
        const photoFrame = document.createElement("div");
        photoFrame.className = "photo-frame";
        const img = document.createElement("img");
        img.className = "pet-photo-widget";
        img.src = pet.photo || "";
        img.alt = name;
        img.loading = "lazy";
        img.decoding = "async";
        photoFrame.appendChild(img);
        photoShell.appendChild(photoFrame);
        const details = document.createElement("div");
        details.className = "pet-details-widget";
        const nameEl = document.createElement("div");
        nameEl.className = "pet-name-widget";
        nameEl.textContent = name;
        const breedEl = document.createElement("div");
        breedEl.className = "pet-breed";
        breedEl.textContent = pet.breed || "";
        const chips = document.createElement("div");
        chips.className = "chip-row";
        [
          speciesRaw || "Pet",
          pet.gender || "Unknown",
          pet.age || "Age N/A",
          pet.location || "Location",
        ].forEach(function (text) {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.textContent = text;
          chips.appendChild(chip);
        });
        const viewEl = document.createElement("div");
        viewEl.className = "view-profile-widget";
        const viewLink = document.createElement("a");
        viewLink.href = profileURL;
        viewLink.target = "_blank";
        viewLink.rel = "noopener noreferrer";
        viewLink.textContent = "View Profile";
        viewEl.appendChild(viewLink);
        details.append(nameEl, breedEl, chips, viewEl);
        card.append(photoShell, details);
        return card;
      }

      function renderRow(rowId, limitedList, fullList) {
        const row = document.getElementById(rowId);
        if (!row) return;
        const baseList = limitedList && limitedList.length ? limitedList : fullList;
        if (!baseList || !baseList.length) {
          row.textContent = "No pets to show.";
          return;
        }
        row.innerHTML = "";
        const viewport = document.createElement("div");
        viewport.className = "scroll-viewport";
        const track = document.createElement("div");
        track.className = "scroll-track";
        const marquee = shouldUseInfiniteMarquee();
        if (!marquee) {
          viewport.classList.add("scroll-viewport--static");
          track.classList.add("scroll-track--static");
        }
        const strip1 = document.createElement("div");
        strip1.className = "scroll-strip scroll-strip--primary";
        baseList.forEach(function (pet) {
          strip1.appendChild(makeCard(pet));
        });
        track.appendChild(strip1);
        if (marquee) {
          const strip2 = document.createElement("div");
          strip2.className = "scroll-strip scroll-strip--clone";
          strip2.setAttribute("aria-hidden", "true");
          baseList.forEach(function (pet) {
            strip2.appendChild(makeCard(pet));
          });
          track.appendChild(strip2);
        }
        viewport.appendChild(track);
        row.appendChild(viewport);
      }

      function rerenderFromCache() {
        if (!cachedLongestFull) return;
        renderRow("longestRow", cachedLongest, cachedLongestFull);
      }

      function setupMediaListeners() {
        if (typeof window.matchMedia !== "function") return;
        const mq = window.matchMedia(MOBILE_MQ);
        function onChange() {
          rerenderFromCache();
        }
        if (mq.addEventListener) {
          mq.addEventListener("change", onChange);
        } else if (mq.addListener) {
          mq.addListener(onChange);
        }
        const mqRm = window.matchMedia("(prefers-reduced-motion: reduce)");
        if (mqRm.addEventListener) {
          mqRm.addEventListener("change", onChange);
        } else if (mqRm.addListener) {
          mqRm.addListener(onChange);
        }
      }

      function setupFullscreen(root) {
        const dlg = root.querySelector("#featuredPetsFsDialog");
        const expandBtn = root.querySelector("#fpwExpandBtn");
        const closeBtn = dlg ? dlg.querySelector(".fpw-fs-close") : null;
        const mountLongest = root.querySelector("#fpw-fs-longest");
        if (!dlg || !expandBtn || !closeBtn || !mountLongest) return;

        let prevBodyOverflow = "";

        function fillMounts() {
          mountLongest.innerHTML = "";
          const viewport = root.querySelector("#longestRow .scroll-viewport");
          if (viewport) mountLongest.appendChild(viewport.cloneNode(true));
        }

        function cleanupFs() {
          document.body.style.overflow = prevBodyOverflow;
          expandBtn.setAttribute("aria-expanded", "false");
          mountLongest.innerHTML = "";
          expandBtn.focus();
        }

        function openFs() {
          fillMounts();
          prevBodyOverflow = document.body.style.overflow || "";
          document.body.style.overflow = "hidden";
          expandBtn.setAttribute("aria-expanded", "true");
          if (typeof dlg.showModal === "function") {
            dlg.showModal();
          }
          closeBtn.focus();
        }

        expandBtn.addEventListener("click", openFs);
        closeBtn.addEventListener("click", function () {
          if (typeof dlg.close === "function") dlg.close();
        });
        dlg.addEventListener("close", cleanupFs);
      }

      let loaded = false;
      function loadCarouselData() {
        if (loaded) return;
        loaded = true;
        fetch(restUrl(), { headers: { Accept: "application/json" } })
          .then(function (res) {
            if (!res.ok) throw res;
            return res.json();
          })
          .then(function (data) {
            const pets = (data && Array.isArray(data.pets)) ? data.pets : [];
            cachedLongestFull = pets;
            cachedLongest = pets.slice(0, MAX_TO_SHOW);
            renderRow("longestRow", cachedLongest, cachedLongestFull);
            setupMediaListeners();
            const root = widgetRoot();
            if (root) setupFullscreen(root);
          })
          .catch(function (err) {
            console.error(err);
            // Keep any server-rendered initial row in place; only show an error
            // message when nothing was pre-rendered.
            const row = document.getElementById("longestRow");
            if (row && !row.querySelector(".pet-card-widget")) {
              row.textContent = "Could not load pets.";
              var toolbar = document.querySelector("#featuredPetsWidget .fpw-toolbar");
              if (toolbar) toolbar.style.display = "none";
            }
          });
      }

      function scheduleCarouselLoad() {
        var root = widgetRoot();
        if (!root) {
          return;
        }
        if (root.getAttribute("data-monroe-defer-carousel") !== "1") {
          loadCarouselData();
          return;
        }
        document.addEventListener("monroe:load-featured-pets", loadCarouselData, { once: true });
      }

      scheduleCarouselLoad();
    })();
  </script>
</div>
