<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flappy Cat</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #71c5cf;
      overflow: hidden;
      touch-action: none; /* Prevent scroll on touch */
      user-select: none;
    }
    #game-canvas {
      display: block;

      height: 100vh;

    /* Loading screen */
    #loading {
      position: absolute;

      width: 100%;
      height: 100%;

      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      font-size: 24px;
      z-index: 10;
      transition: opacity 0.5s ease-in-out;
    }
  </style>
  <script type="module" crossorigin src="./assets/index-D_etShWE.js"></script>
