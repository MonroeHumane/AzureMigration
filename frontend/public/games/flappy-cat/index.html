<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Flappy Cat Host | Humane Arcade</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #071a17;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    #game-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.4s ease-in-out;
      display: block;
    }
    /* Dev/support tool, not player-facing UI - hidden unless ?debug=1 */
    #diagnostics {
      display: none;
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #134e4a;
      border-radius: 8px;
      padding: 10px;
      font-family: monospace;
      font-size: 12px;
      pointer-events: auto;
      z-index: 1000;
      flex-direction: column;
      gap: 5px;
    }
    button {
      background: #0f3d32;
      color: #fff;
      border: 1px solid #2dd4bf;
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover { background: #134e4a; }
  </style>
  <script type="module" crossorigin src="./assets/index-DkBTAN_t.js"></script>
</head>
<body>

  <div id="game-container">
    <iframe id="game-iframe" src="./game/index.html" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>

  <div id="diagnostics">
    <strong>Diagnostics Panel</strong>
    <div id="diag-profile">Profile: Loading...</div>
    <div id="diag-local-gen">Local Gen: --</div>
    <div id="diag-cloud-rev">Cloud Rev: --</div>
    <div id="diag-state">State: --</div>
    <div id="diag-leader">Sync Leader: --</div>
    <div id="diag-network">Network: --</div>
    <button id="btn-sync">Request Sync</button>
    <button id="btn-pause">Toggle Pause</button>
  </div>

  <script>
    // Two-Way Message Relay between Cabinet Parent & Inner Game
    (function () {
      window.addEventListener('message', function (e) {
        if (!e.data || typeof e.data !== 'object') return;
        var gameIframe = document.getElementById('game-iframe');

        // From Parent -> Forward to Child
        if (e.source === window.parent && gameIframe && gameIframe.contentWindow) {
          try {
            gameIframe.contentWindow.postMessage(e.data, '*');
          } catch (err) {}
        }

        // From Child -> Forward to Parent
        if (e.source === (gameIframe && gameIframe.contentWindow) && window.parent && window.parent !== window) {
          try {
            window.parent.postMessage(e.data, '*');
          } catch (err) {}
        }
      });
    })();
  </script>

</body>
</html>
