<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#71c5cf">
  <title>Flappy Cat</title>
  <style>
    :root {
      --fur: #fef6ea;
      --treat: #ffb347;
      --treat-deep: #ff7a3c;
      --mint: #6bc4a6;
      --ink: #2c1c19;
      --sky: #71c5cf;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-l: env(safe-area-inset-left, 0px);
      --safe-r: env(safe-area-inset-right, 0px);
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: var(--sky);
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    #game-shell {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: grid;
      place-items: center;
      padding:
        max(0px, var(--safe-t))
        max(0px, var(--safe-r))
        max(0px, var(--safe-b))
        max(0px, var(--safe-l));
      box-sizing: border-box;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      touch-action: none;
      background: var(--sky);
    }
    /* Landscape phones: keep a portrait playfield so score / get-ready / retry stay readable */
    @media (orientation: landscape) and (max-height: 520px) {
      #game-canvas {
        width: auto;
        height: 100%;
        aspect-ratio: 2 / 3;
        max-width: 100%;
      }
    }
    /* Fail open: never cover the canvas waiting for Penpal. */
    #loading {
      display: none;
      pointer-events: none;
      opacity: 0;
    }

    /* Desktop / fine-pointer key hints on the start screen */
    .fc-hints {
      position: absolute;
      left: 50%;
      bottom: max(12px, calc(var(--safe-b) + 12px));
      transform: translateX(-50%);
      z-index: 5;
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      pointer-events: none;
      max-width: min(92vw, 440px);
      opacity: 1;
      transition: opacity 0.35s ease;
    }
    @media (hover: hover) and (pointer: fine) {
      .fc-hints { display: flex; }
      html.fc-playing .fc-hints,
      html.fc-over .fc-hints { opacity: 0; }
    }
    .fc-chip {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 12px;
      letter-spacing: 0.03em;
      color: var(--ink);
      background: color-mix(in srgb, var(--fur) 94%, white);
      border: 1px solid color-mix(in srgb, var(--mint) 50%, #1c3d35);
      border-radius: 999px;
      padding: 7px 12px;
      box-shadow: 0 4px 12px rgba(44, 28, 25, 0.14);
      white-space: nowrap;
    }
    .fc-chip kbd {
      display: inline-block;
      font: 700 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 3px 6px;
      margin: 0 2px;
      border-radius: 5px;
      border: 1px solid rgba(44, 28, 25, 0.18);
      background: #fff;
      box-shadow: 0 1px 0 rgba(44, 28, 25, 0.12);
    }

    /* Mobile / coarse: large tap-to-flap control (44px+), clears bottom HUD */
    .fc-flap-btn {
      display: none;
      position: absolute;
      right: max(12px, calc(var(--safe-r) + 12px));
      bottom: max(16px, calc(var(--safe-b) + 16px));
      z-index: 6;
      min-width: 72px;
      min-height: 72px;
      padding: 14px 18px;
      border-radius: 999px;
      border: 2px solid #1c3d35;
      background: linear-gradient(180deg, var(--treat), var(--treat-deep));
      color: #fff;
      font: 800 14px/1.1 system-ui, -apple-system, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 8px 20px rgba(44, 28, 25, 0.28);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }
    .fc-flap-btn:active {
      transform: scale(0.96);
      filter: brightness(0.96);
    }
    @media (hover: none) and (pointer: coarse) {
      .fc-flap-btn { display: inline-flex; }
      .fc-hints { display: none !important; }
    }
    /* Narrow hub iframe: prefer touch affordance over desktop chips */
    @media (max-width: 720px) {
      html.fc-embed .fc-flap-btn { display: inline-flex; }
      html.fc-embed .fc-hints { display: none !important; }
    }

    /* In-play visual juice overlays (DOM; packed canvas engine already has some FX) */
    .fc-fx-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      overflow: hidden;
      border-radius: inherit;
    }
    .fc-fx-vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 42%, transparent 42%, rgba(20, 40, 48, 0.22) 100%);
      opacity: 0.55;
      transition: opacity 0.4s ease;
    }
    html.fc-playing .fc-fx-vignette { opacity: 0.7; }
    .fc-fx-parallax {
      position: absolute;
      inset: -8% -12%;
      background:
        radial-gradient(circle at 18% 28%, rgba(255,255,255,0.12) 0%, transparent 42%),
        radial-gradient(circle at 78% 18%, rgba(255,179,71,0.14) 0%, transparent 38%);
      opacity: 0.35;
      transform: translate3d(0,0,0);
      will-change: transform;
    }
    html.fc-playing .fc-fx-parallax {
      animation: fcParallaxDrift 7s ease-in-out infinite alternate;
    }
    @keyframes fcParallaxDrift {
      from { transform: translate3d(-1.2%, 0.6%, 0) scale(1.02); }
      to   { transform: translate3d(1.4%, -0.8%, 0) scale(1.04); }
    }
    .fc-fx-flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
    }
    .fc-fx-flash.is-on {
      animation: fcDeathFlash 0.38s ease-out;
    }
    @keyframes fcDeathFlash {
      0% { opacity: 0.55; }
      100% { opacity: 0; }
    }
    .fc-fx-pops {
      position: absolute;
      inset: 0;
    }
    .fc-score-pop {
      position: absolute;
      left: 50%;
      top: 28%;
      transform: translate(-50%, 0);
      font: 800 22px/1 system-ui, -apple-system, sans-serif;
      color: #ffd166;
      text-shadow: 0 2px 0 rgba(44,28,25,0.45), 0 0 12px rgba(255,179,71,0.55);
      animation: fcScorePop 0.7s ease-out forwards;
      will-change: transform, opacity;
    }
    @keyframes fcScorePop {
      0% { opacity: 0; transform: translate(-50%, 8px) scale(0.7); }
      18% { opacity: 1; transform: translate(-50%, -4px) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -42px) scale(1); }
    }
    #game-shell.fc-nudge {
      animation: fcNudge 0.16s ease-out;
    }
    @keyframes fcNudge {
      0% { transform: translateY(0) scale(1); }
      35% { transform: translateY(3px) scale(1.012, 0.985); }
      100% { transform: translateY(0) scale(1); }
    }
    #game-shell.fc-shake {
      animation: fcShake 0.42s cubic-bezier(.36,.07,.19,.97);
    }
    @keyframes fcShake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-5px, 2px); }
      40% { transform: translate(5px, -3px); }
      60% { transform: translate(-4px, -1px); }
      80% { transform: translate(3px, 2px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .fc-fx-parallax,
      html.fc-playing .fc-fx-parallax { animation: none !important; opacity: 0.2; }
      #game-shell.fc-nudge,
      #game-shell.fc-shake { animation: none !important; }
      .fc-score-pop { animation: none !important; opacity: 0.9; transform: translate(-50%, -12px); }
      .fc-fx-flash.is-on { animation: none !important; opacity: 0.25; transition: opacity 0.2s ease; }
    }

    @media (orientation: landscape) and (max-height: 520px) {
      .fc-flap-btn {
        min-width: 64px;
        min-height: 64px;
        right: max(8px, calc(var(--safe-r) + 8px));
        bottom: 50%;
        transform: translateY(50%);
      }
      .fc-flap-btn:active { transform: translateY(50%) scale(0.96); }
      .fc-hints { bottom: max(8px, calc(var(--safe-b) + 8px)); }
    }
  </style>
  <script>
    // Pass mascot → in-game companion index before the game module reads flappyCatCompanion.
    // Cat-only: smokey/marmalade map; unknown and non-cats (barnaby, daisy, pip) → smokey.
    (function seedCompanionFromPass() {
      var CAT_COMPANIONS = { smokey: 0, marmalade: 1 };
      try {
        var mascot = String(localStorage.getItem('monroeArcadeMascot') || 'smokey').toLowerCase();
        var idx = Object.prototype.hasOwnProperty.call(CAT_COMPANIONS, mascot) ? CAT_COMPANIONS[mascot] : 0;
        localStorage.setItem('flappyCatCompanion', String(idx));
      } catch (e) {}
    })();
  </script>
  <script type="module" crossorigin src="./assets/index-D_etShWE.js"></script>
</head>
<body>
  <div id="loading" aria-hidden="true">Connecting to Humane Arcade...</div>
  <div id="game-shell">
    <canvas id="game-canvas" tabindex="0" aria-label="Flappy Cat playfield"></canvas>
    <div class="fc-hints" id="fc-hints" aria-hidden="true">
      <span class="fc-chip"><kbd>Space</kbd> / click to flap</span>
      <span class="fc-chip"><kbd>M</kbd> mute · <kbd>C</kbd> / <kbd>Tab</kbd> companion</span>
    </div>
    <div class="fc-fx-layer" id="fc-fx" aria-hidden="true">
      <div class="fc-fx-parallax" id="fc-fx-parallax"></div>
      <div class="fc-fx-vignette"></div>
      <div class="fc-fx-flash" id="fc-fx-flash"></div>
      <div class="fc-fx-pops" id="fc-fx-pops"></div>
    </div>
    <button type="button" class="fc-flap-btn" id="fc-flap" aria-label="Tap to flap">Flap</button>
  </div>

  <script src="../../dex/dex-shared.js?v=6"></script>

  <script>
    // Arcade Integration Bridge: mute, scores, and cabinet postMessage.
    // Runs on the inner game document only so host/cabinet never double-submit.
    // Adoptedex claimReward wiring preserved from #28 (server-authoritative; no monroeDexPacks invent).
    (function () {
      var pendingMute = null;
      var params = new URLSearchParams(window.location.search);
      if (params.get('embed') === '1') {
        document.documentElement.classList.add('fc-embed');
      }

      function applyMute(muted) {
        if (window.gameInstance && window.gameInstance.audio) {
          window.gameInstance.soundEnabled = !muted;
          window.gameInstance.audio.setMuted(muted);
        }
      }

      window.addEventListener('message', function (e) {
        if (!e.data || typeof e.data !== 'object') return;
        if (e.data.type === 'arcade:set_mute') {
          pendingMute = !!e.data.muted;
          applyMute(pendingMute);
        }
      });

      function hookScoreReporting() {
        var model = window.gameInstance && window.gameInstance.model;
        if (!model || typeof model.onDeathCallback !== 'function') {
          setTimeout(hookScoreReporting, 200);
          return;
        }
        if (model._arcadeScoreHooked) return;
        model._arcadeScoreHooked = true;

        var origDeath = model.onDeathCallback;
        model.onDeathCallback = function () {
          if (typeof origDeath === 'function') {
            try { origDeath.apply(this, arguments); } catch (err) {}
          }

          var finalScore = (window.gameInstance.model && window.gameInstance.model.score) || 0;
          if (finalScore > 0) {
            var player = (window.gameInstance.userSlug || localStorage.getItem('monroeDexUser') || 'Player').trim();

            try {
              if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                  type: 'arcade:score_recorded',
                  game: 'flappy_cat',
                  gameId: 'flappy_cat',
                  score: finalScore,
                  player: player
                }, '*');
              }
            } catch (err) {}

            try {
              fetch('/arcade-api/v1/scores', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  gameId: 'flappy_cat',
                  score: finalScore,
                  playerName: player
                })
              }).catch(function () {});
            } catch (err) {}
          }
        };
      }

      hookScoreReporting();

      function hookMilestones() {
        if (!window.gameInstance) {
          setTimeout(hookMilestones, 200);
          return;
        }
        if (window.gameInstance._arcadeMilestoneHooked) return;
        window.gameInstance._arcadeMilestoneHooked = true;
        if (pendingMute !== null) applyMute(pendingMute);

        // Seed user/api from shared Adoptédex client (URL + localStorage).
        try {
          if (typeof MonroeAdoptedex !== 'undefined') {
            var p = MonroeAdoptedex.getParams();
            if (p.dexUser && !window.gameInstance.userSlug) {
              window.gameInstance.userSlug = p.dexUser;
            }
            if (p.dexApi) {
              window.gameInstance.restBase = p.dexApi;
            }
          }
        } catch (e) {}

        // Replace localStorage monkeypatch: server-authoritative claimReward only.
        // Do NOT bump monroeDexPacks or postMessage unless claimed:true.
        window.gameInstance.claimReward = function (tier, key, toastMsg) {
          var Dex = window.MonroeAdoptedex;
          var user = (window.gameInstance.userSlug || (Dex && Dex.getParams().dexUser) || '').trim().toLowerCase();
          var api = (window.gameInstance.restBase || (Dex && Dex.getParams().dexApi) || '').replace(/\/?$/, '/');
          if (!Dex || !user) {
            console.warn('[Flappy] MonroeAdoptedex unavailable; skipping pack claim for', key);
            return;
          }
          Dex.claimReward(api, user, 'flappy_cat', key, { tier: tier || 'standard', count: 1 })
            .then(function (result) {
              if (!(result && result.claimed)) return;
              try {
                window.gameInstance.discoveryToast = { text: toastMsg || ('Pack unlocked: ' + key), timer: 5, alpha: 1 };
                if (window.gameInstance.audio && typeof window.gameInstance.audio.playPoint === 'function') {
                  window.gameInstance.audio.playPoint();
                }
              } catch (err) {}
              if (typeof Dex.showRewardToast === 'function') {
                Dex.showRewardToast({
                  title: toastMsg || 'Flappy Cat pack!',
                  message: 'Score milestone ' + key + ' claimed. Open it in your Adoptédex album.',
                  game: 'Flappy Cat',
                  tier: tier,
                  rare: key === 'score_30' || key === 'score_50'
                });
              }
              // claimReward already posts adoptedex:pack_awarded to parent.
            })
            .catch(function (err) {
              console.warn('[Flappy] claimReward failed:', err);
            });
        };
      }

      hookMilestones();

      // Sync start / playing / game-over chrome without rewriting the canvas engine.
      function syncChrome() {
        var model = window.gameInstance && window.gameInstance.model;
        var state = model && model.state;
        document.documentElement.classList.toggle('fc-playing', state === 'PLAYING' || state === 'DYING');
        document.documentElement.classList.toggle('fc-over', state === 'GAME_OVER');
        document.documentElement.classList.toggle('fc-ready', !state || state === 'READY');
      }
      setInterval(syncChrome, 250);

      // Mobile FLAP control → same pointer path the bundled input uses on the canvas.
      var canvas = document.getElementById('game-canvas');
      var flapBtn = document.getElementById('fc-flap');
      function fireFlap(fromEl) {
        if (!canvas) return;
        var rect = canvas.getBoundingClientRect();
        var x = rect.left + rect.width * 0.5;
        var y = rect.top + rect.height * 0.55;
        var opts = { bubbles: true, cancelable: true, clientX: x, clientY: y, pointerId: 1, pointerType: 'touch', isPrimary: true };
        try {
          canvas.dispatchEvent(new PointerEvent('pointerdown', opts));
          canvas.dispatchEvent(new PointerEvent('pointerup', opts));
        } catch (err) {
          try {
            canvas.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, clientX: x, clientY: y }));
          } catch (e2) {}
        }
        if (fromEl && fromEl.focus) {
          try { canvas.focus({ preventScroll: true }); } catch (e3) {}
        }
      }
      if (flapBtn) {
        flapBtn.addEventListener('pointerdown', function (e) {
          e.preventDefault();
          e.stopPropagation();
          fireFlap(flapBtn);
        });
        flapBtn.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
        });
      }


      // DOM overlay juice — amplifies packed canvas FX without editing the bundle.
      (function installVisualJuice() {
        var reduced = false;
        try {
          reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        } catch (e) {}
        var shell = document.getElementById('game-shell');
        var flashEl = document.getElementById('fc-fx-flash');
        var pops = document.getElementById('fc-fx-pops');
        var lastScore = 0;
        var lastState = '';
        var nudgeTimer = null;
        var shakeTimer = null;

        function nudge() {
          if (!shell || reduced) return;
          shell.classList.remove('fc-nudge');
          void shell.offsetWidth;
          shell.classList.add('fc-nudge');
          clearTimeout(nudgeTimer);
          nudgeTimer = setTimeout(function () { shell.classList.remove('fc-nudge'); }, 180);
        }

        function shakeAndFlash() {
          if (!shell) return;
          if (!reduced) {
            shell.classList.remove('fc-shake');
            void shell.offsetWidth;
            shell.classList.add('fc-shake');
            clearTimeout(shakeTimer);
            shakeTimer = setTimeout(function () { shell.classList.remove('fc-shake'); }, 450);
          }
          if (flashEl) {
            flashEl.classList.remove('is-on');
            void flashEl.offsetWidth;
            flashEl.classList.add('is-on');
            setTimeout(function () { flashEl.classList.remove('is-on'); }, reduced ? 220 : 400);
          }
        }

        function scorePop() {
          if (!pops) return;
          var el = document.createElement('div');
          el.className = 'fc-score-pop';
          el.textContent = '+1';
          pops.appendChild(el);
          setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, reduced ? 500 : 750);
        }

        // Flap: canvas pointer + mobile flap button + Space/ArrowUp
        function onFlapIntent() {
          var model = window.gameInstance && window.gameInstance.model;
          var st = model && model.state;
          if (st === 'PLAYING' || st === 'READY') nudge();
        }
        if (canvas) {
          canvas.addEventListener('pointerdown', onFlapIntent, { passive: true });
        }
        if (flapBtn) {
          flapBtn.addEventListener('pointerdown', onFlapIntent, { passive: true });
        }
        window.addEventListener('keydown', function (e) {
          if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') onFlapIntent();
        });

        function tickJuice() {
          var model = window.gameInstance && window.gameInstance.model;
          if (!model) return;
          var score = model.score || 0;
          var state = model.state || '';
          if (score > lastScore && state === 'PLAYING') scorePop();
          lastScore = score;
          if ((state === 'DYING' || state === 'GAME_OVER') && lastState !== 'DYING' && lastState !== 'GAME_OVER') {
            shakeAndFlash();
          }
          if (state === 'READY' || state === 'PLAYING') {
            // reset death edge when a new round starts
          }
          if (state === 'READY' && (lastState === 'GAME_OVER' || lastState === 'DYING')) {
            lastScore = 0;
          }
          lastState = state;
        }
        setInterval(tickJuice, 50);
      })();

      // Reduce double-tap zoom / gesture annoyances inside the iframe.
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
        document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
      });
      var lastTouchEnd = 0;
      document.addEventListener('touchend', function (e) {
        var now = Date.now();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });
    })();
  </script>
</body>
</html>
