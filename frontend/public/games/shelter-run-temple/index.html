<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Shelter Run – Temple Trail (Monroe Humane)</title>
  <meta name="description" content="Pseudo-3D 3-lane endless runner: swipe to change lanes, jump, and slide. Rescue real shelter pets. Made for Monroe Humane Society." />
  <meta name="theme-color" content="#0a1f2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏃</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="embed.js"></script>
  <script src="../theme.js?v=2"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container" role="main" aria-label="Shelter Run Temple – 3-lane endless runner">
    <button type="button" class="sr-chrome-exit" id="srExitBtn" aria-label="Exit to games hub">← Exit</button>
    <div class="sr-fx-layer" id="srFx" aria-hidden="true">
      <div class="sr-fx-speedlines" id="srSpeedLines"></div>
      <div class="sr-fx-hurt" id="srHurtFlash"></div>
      <div class="sr-fx-celebrate" id="srCelebrateFlash"></div>
    </div>
    <div class="sr-key-hints" id="srKeyHints" aria-hidden="true">
      <span class="sr-key-hints__item"><kbd>←</kbd><kbd>→</kbd> lane</span>
      <span class="sr-key-hints__item"><kbd>↑</kbd>/<kbd>Space</kbd> jump</span>
      <span class="sr-key-hints__item"><kbd>↓</kbd> slide</span>
    </div>
  </div>

  <script src="vendor/phaser.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.min.js'"></script>
  <script src="../dex/dex-shared.js?v=6"></script>
  <script src="src/constants.js"></script>
  <script src="src/rng.js"></script>
  <script src="src/perspective.js"></script>
  <script src="src/lanes.js"></script>
  <script src="src/graphics.js"></script>
  <script src="src/fx.js"></script>
  <script src="src/levelgen.js"></script>
  <script src="src/pets.js"></script>
  <script src="src/dex-integration.js"></script>
  <script src="src/Player.js"></script>
  <script src="src/TouchControls.js"></script>
  <script src="src/scenes/BootScene.js"></script>
  <script src="src/scenes/MainMenuScene.js"></script>
  <script src="src/scenes/GameScene.js"></script>
  <script src="src/scenes/RoundOverScene.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
