<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="Gentle dog">
  <defs>
    <radialGradient id="g" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.06"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" rx="28" fill="#E5F0FF"/>
  <circle cx="200" cy="200" r="150" fill="url(#g)"/>
  <!-- ears -->
  <ellipse cx="95" cy="145" rx="38" ry="62" fill="#D2691E" transform="rotate(-18 95 145)"/>
  <ellipse cx="95" cy="145" rx="22" ry="40" fill="#F0C090" transform="rotate(-18 95 145)"/>
  <ellipse cx="305" cy="145" rx="38" ry="62" fill="#D2691E" transform="rotate(18 305 145)"/>
  <ellipse cx="305" cy="145" rx="22" ry="40" fill="#F0C090" transform="rotate(18 305 145)"/>
  <!-- head -->
  <ellipse cx="200" cy="195" rx="118" ry="110" fill="#D2691E"/>
  <!-- snout -->
  <ellipse cx="200" cy="245" rx="58" ry="42" fill="#F0C090"/>
  <ellipse cx="200" cy="238" rx="18" ry="14" fill="#8B4513"/>
  <!-- eyes -->
  <ellipse cx="155" cy="175" rx="16" ry="20" fill="#2C1C19"/>
  <ellipse cx="245" cy="175" rx="16" ry="20" fill="#2C1C19"/>
  <circle cx="160" cy="168" r="5" fill="#fff"/>
  <circle cx="250" cy="168" r="5" fill="#fff"/>
  <!-- smile -->
  <path d="M170 260 Q200 278 230 260" fill="none" stroke="#8B4513" stroke-width="5" stroke-linecap="round"/>
  <!-- collar -->
  <path d="M105 285 Q200 320 295 285" fill="none" stroke="#007A3D" stroke-width="14" stroke-linecap="round"/>
  <circle cx="200" cy="312" r="12" fill="#F4C430" stroke="#C49A00" stroke-width="2"/>
</svg>
