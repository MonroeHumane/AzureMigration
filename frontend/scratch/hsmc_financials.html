<title>HSMC Financials</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --pos: #006300;
    --neg: #9c3b2e;
    --s1: #2a78d6;
    --s2: #eb6834;
    --s3: #1baf7a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255,255,255,0.10);
      --pos: #0ca30c;
      --neg: #e08a7b;
      --s1: #3987e5;
      --s2: #d95926;
      --s3: #199e70;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --pos: #0ca30c;
    --neg: #e08a7b;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--page); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  .app { display: flex; flex-direction: column; height: 100vh; }

  /* ---- Tabs ---- */
  .tabbar {
    display: flex; align-items: center; gap: 28px;
    padding: 0 28px; height: 48px; flex: none;
    border-bottom: 1px solid var(--border);
    background: var(--page);
  }
  .tab {
    font-size: 14px; font-weight: 600; color: var(--muted);
    background: none; border: none; cursor: pointer;
    height: 48px; padding: 0; border-bottom: 2px solid transparent;
    font-family: inherit;
  }
  .tab.active { color: var(--ink); border-bottom-color: var(--ink); }
  .tab:hover:not(.active) { color: var(--ink-2); }

  .panel { flex: 1 1 auto; min-height: 0; }
  .panel[hidden] { display: none; }

  /* ---- Tab 1: Overview ---- */
  #overview { display: grid; grid-template-columns: 1.55fr 1fr; gap: 1px; height: 100%; background: var(--border); }
  .col { background: var(--page); min-height: 0; display: flex; flex-direction: column; }
  .col-pad { padding: 18px 26px; }

  table.su { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.su th { text-align: right; font-weight: 600; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 4px 0 8px; border-bottom: 1px solid var(--grid); }
  table.su th:first-child { text-align: left; }
  table.su td { padding: 4.5px 0; border-bottom: 1px solid var(--grid); }
  table.su td.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.su tr.total td { font-weight: 700; border-top: 1px solid var(--ink-2); border-bottom: none; padding-top: 7px; }
  table.su tr.total.net td { border-top: 1px solid var(--ink); }
  table.su tr.spacer td { border: none; padding: 6px 0; }
  .neg { color: var(--neg); }
  .pos { color: var(--pos); }

  .stat-row { display: flex; gap: 1px; background: var(--border); flex: none; }
  .stat { flex: 1; background: var(--page); padding: 14px 18px; }
  .stat .n { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }

  .chart-wrap { flex: 1 1 auto; min-height: 0; padding: 14px 22px 18px; display: flex; flex-direction: column; }
  .chart-title { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .grid-line { stroke: var(--grid); stroke-width: 1; }
  .axis-line { stroke: var(--axis); stroke-width: 1; }
  .tick { fill: var(--muted); font-size: 11px; }
  .lbl { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .lbl-sub { fill: var(--ink-2); font-size: 10.5px; }

  /* ---- Tab 2: Checking chart ---- */
  #checking { height: 100%; display: flex; flex-direction: column; padding: 20px 34px 26px; }
  #checkingChart { flex: 1 1 auto; min-height: 0; }

  .tooltip {
    position: fixed; pointer-events: none; background: var(--ink); color: var(--page);
    font-size: 12px; padding: 8px 10px; border-radius: 6px; opacity: 0; transition: opacity .08s;
    transform: translate(-50%, -110%); z-index: 20; white-space: nowrap;
  }
  .tooltip.show { opacity: 1; }
  .tooltip b { font-variant-numeric: tabular-nums; }
  .tooltip .row { display: flex; gap: 10px; justify-content: space-between; }
  .tooltip .row + .row { margin-top: 2px; }
</style>

<div class="app">
  <div class="tabbar">
    <button class="tab active" data-tab="overview">Overview</button>
    <button class="tab" data-tab="checking">Checking Account</button>
  </div>

  <div class="panel" id="panel-overview">
    <div id="overview">
      <div class="col">
        <div class="col-pad" style="flex:1; overflow:hidden; display:flex; flex-direction:column;">
          <table class="su" id="suTable">
            <thead><tr><th>Sources &amp; Uses of Cash</th><th>2024</th><th>2025</th><th>2026 YTD</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      <div class="col">
        <div class="stat-row">
          <div class="stat"><div class="n" id="statChecking"></div><div class="l">Checking balance</div></div>
          <div class="stat"><div class="n" id="statCC"></div><div class="l">Credit card owed</div></div>
        </div>
        <div class="chart-wrap">
          <div class="chart-title">Revenue vs. Payroll &amp; Benefits, indexed to 2024 (Jan&ndash;Aug)</div>
          <svg id="growthChart" viewBox="0 0 560 300" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
      </div>
    </div>
  </div>

  <div class="panel" id="panel-checking" hidden>
    <div id="checking">
      <div id="checkingChart"><svg id="checkingSvg" viewBox="0 0 1600 760" preserveAspectRatio="xMidYMid meet"></svg></div>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
function money(n, decimals) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  decimals = decimals || 0;
  const abs = Math.abs(n);
  const s = abs.toLocaleString('en-US', {minimumFractionDigits: decimals, maximumFractionDigits: decimals});
  return (n < 0 ? '-$' : '$') + s;
}

/* ---------------- Tabs ---------------- */
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.panel').forEach(p => p.hidden = true);
    document.getElementById('panel-' + btn.dataset.tab).hidden = false;
  });
});

/* ---------------- Overview: Sources & Uses table ---------------- */
const SU = {
  revenue: [
    {c:'Donations & Contributions', y24:347663.98, y25:493478.64, y26:110474.60},
    {c:'Grants', y24:0, y25:7981.00, y26:6523.00},
    {c:'Program Fee Income', y24:199576.87, y25:175113.00, y26:102848.40},
    {c:'Special Events & Fundraising', y24:0, y25:144288.86, y26:139413.86},
    {c:'Other Income', y24:0, y25:1190.00, y26:0},
  ],
  expense: [
    {c:'Payroll & Benefits', y24:-317607.38, y25:-399722.90, y26:-338643.53},
    {c:'Veterinary & Medical Care', y24:-67237.72, y25:-113851.06, y26:-77853.86},
    {c:'Shelter Operations', y24:-9700.79, y25:-58302.88, y26:-19201.73},
    {c:'Vehicle & Transport', y24:-7339.33, y25:-7501.98, y26:-8440.56},
    {c:'Facilities & Building', y24:-25636.34, y25:-21450.74, y26:-9135.33},
    {c:'Office & Operations', y24:-7340.23, y25:-16016.42, y26:-10013.65},
    {c:'Insurance', y24:-10012.00, y25:-12992.47, y26:-5720.61},
    {c:'Fundraising & Marketing', y24:-2907.06, y25:-27056.24, y26:-15642.20},
    {c:'Other', y24:-30068.99, y25:-1742.00, y26:-4515.93},
  ],
  totals: {
    y24:{rev:547240.85, exp:-477849.84, net:69391.01},
    y25:{rev:822051.50, exp:-658744.27, net:163307.23},
    y26:{rev:359259.86, exp:-489167.40, net:-129907.54},
  }
};

function renderSU() {
  const tb = document.querySelector('#suTable tbody');
  let h = '';
  SU.revenue.forEach(r => {
    h += `<tr><td>${r.c}</td><td class="num">${money(r.y24)}</td><td class="num">${money(r.y25)}</td><td class="num">${money(r.y26)}</td></tr>`;
  });
  const t = SU.totals;
  h += `<tr class="total"><td>Total Revenue</td><td class="num">${money(t.y24.rev)}</td><td class="num">${money(t.y25.rev)}</td><td class="num">${money(t.y26.rev)}</td></tr>`;
  h += `<tr class="spacer"><td colspan="4"></td></tr>`;
  SU.expense.forEach(r => {
    h += `<tr><td>${r.c}</td><td class="num">${money(r.y24)}</td><td class="num">${money(r.y25)}</td><td class="num">${money(r.y26)}</td></tr>`;
  });
  h += `<tr class="total"><td>Total Expense</td><td class="num">${money(t.y24.exp)}</td><td class="num">${money(t.y25.exp)}</td><td class="num">${money(t.y26.exp)}</td></tr>`;
  h += `<tr class="total net"><td>Net Cash</td>`
     + `<td class="num ${t.y24.net<0?'neg':'pos'}">${money(t.y24.net)}</td>`
     + `<td class="num ${t.y25.net<0?'neg':'pos'}">${money(t.y25.net)}</td>`
     + `<td class="num ${t.y26.net<0?'neg':'pos'}">${money(t.y26.net)}</td></tr>`;
  tb.innerHTML = h;
}
renderSU();

document.getElementById('statChecking').textContent = money(26159.98);
document.getElementById('statCC').textContent = money(6912, 0);

/* ---------------- Overview: growth chart ---------------- */
(function () {
  const years = ['2024', '2025', '2026'];
  const rev = [307508.86, 317861.12, 359259.86];
  const payroll = [166538.55, 264214.75, 338643.53];
  const revIdx = rev.map(v => v / rev[0] * 100);
  const payIdx = payroll.map(v => v / payroll[0] * 100);

  const W = 560, H = 300, left = 46, right = 460, top = 20, bottom = 250, labelY = 272;
  const maxIdx = Math.max(...revIdx, ...payIdx) * 1.08;
  const minIdx = 90;
  const yFor = v => bottom - (v - minIdx) / (maxIdx - minIdx) * (bottom - top);
  const xFor = i => left + (right - left) * i / (years.length - 1);

  let svg = '';
  const base100Y = yFor(100);
  svg += `<line class="grid-line" x1="${left}" y1="${base100Y}" x2="${right}" y2="${base100Y}"/>`;
  svg += `<text class="tick" x="${right}" y="${base100Y - 6}" text-anchor="end">2024 baseline</text>`;

  function path(vals) { return vals.map((v,i) => (i===0?'M':'L') + xFor(i).toFixed(1) + ' ' + yFor(v).toFixed(1)).join(' '); }
  svg += `<path d="${path(revIdx)}" fill="none" stroke="var(--s1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  svg += `<path d="${path(payIdx)}" fill="none" stroke="var(--s2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;

  years.forEach((yr, i) => {
    svg += `<circle cx="${xFor(i)}" cy="${yFor(revIdx[i])}" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>`;
    svg += `<circle cx="${xFor(i)}" cy="${yFor(payIdx[i])}" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>`;
    svg += `<text class="tick" x="${xFor(i)}" y="${labelY}" text-anchor="middle">${yr}</text>`;
  });
  svg += `<text class="lbl" x="${xFor(2)+8}" y="${yFor(revIdx[2])-6}" fill="var(--s1)">Revenue ${revIdx[2].toFixed(0)}</text>`;
  svg += `<text class="lbl" x="${xFor(2)+8}" y="${yFor(payIdx[2])+16}" fill="var(--s2)">Payroll ${payIdx[2].toFixed(0)}</text>`;

  document.getElementById('growthChart').innerHTML = svg;
})();

/* ---------------- Checking account: one continuous monthly balance line ---------------- */
const CHECKING = {
  2024: [6001.71,24435.77,44531.64,102419.36,105829.53,72681.92,51609.56,87405.79,95797.86,122240.31,112009.49,87263.39],
  2025: [55004.19,46284.80,64283.06,86747.94,67318.47,41373.51,31588.83,-30884.60,41304.60,124686.52,135852.22,129224.11],
  2026: [123186.73,129301.47,104986.54,131328.97,114642.77,112968.70,54262.48,25065.66,26159.98],
};
const MONTH_LABELS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// Flatten into one continuous chronological series -- this is a single
// account's real running balance, not three independent series, so it reads
// as one connected line rather than three overlaid same-month comparisons.
const SERIES = [];
[2024, 2025, 2026].forEach(yr => {
  CHECKING[yr].forEach((v, i) => SERIES.push({ year: yr, month: i, value: v }));
});

(function () {
  const W = 1900, H = 760;
  const left = 90, right = W - 40, top = 28, bottom = H - 60;
  const allVals = SERIES.map(d => d.value);
  const minV = Math.min(...allVals, 0);
  const maxV = Math.max(...allVals);
  const pad = (maxV - minV) * 0.08;
  const lo = minV - pad, hi = maxV + pad;
  const yFor = v => bottom - (v - lo) / (hi - lo) * (bottom - top);
  const xFor = i => left + (right - left) * i / (SERIES.length - 1);

  let svg = '';

  // gridlines every $25k
  const step = 25000;
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    const y = yFor(v);
    svg += `<line class="grid-line" x1="${left}" y1="${y}" x2="${right}" y2="${y}"/>`;
    svg += `<text class="tick" x="${left - 12}" y="${y + 4}" text-anchor="end">${(v/1000).toFixed(0)}K</text>`;
  }
  if (lo < 0) {
    svg += `<line class="axis-line" x1="${left}" y1="${yFor(0)}" x2="${right}" y2="${yFor(0)}"/>`;
  }

  // Year-boundary dividers (light vertical rule at each January) + year labels
  SERIES.forEach((d, i) => {
    if (d.month === 0) {
      const x = xFor(i);
      if (i > 0) svg += `<line class="grid-line" x1="${x}" y1="${top}" x2="${x}" y2="${bottom}"/>`;
      svg += `<text class="lbl-sub" x="${x}" y="${top - 10}" text-anchor="${i === 0 ? 'start' : 'middle'}">${d.year}</text>`;
    }
  });

  // Month ticks -- every month, but only label Jan/Apr/Jul/Oct to avoid clutter
  SERIES.forEach((d, i) => {
    if (d.month % 3 === 0) {
      svg += `<text class="tick" x="${xFor(i)}" y="${bottom + 24}" text-anchor="middle">${MONTH_LABELS[d.month]}</text>`;
    }
  });
  svg += `<line class="axis-line" x1="${left}" y1="${bottom}" x2="${right}" y2="${bottom}"/>`;

  const linePath = SERIES.map((d, i) => (i === 0 ? 'M' : 'L') + xFor(i).toFixed(1) + ' ' + yFor(d.value).toFixed(1)).join(' ');
  svg += `<path d="${linePath}" fill="none" stroke="var(--s1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;

  SERIES.forEach((d, i) => {
    svg += `<circle class="pt" data-i="${i}" cx="${xFor(i)}" cy="${yFor(d.value)}" r="3" fill="var(--s1)" stroke="var(--surface)" stroke-width="1.5"/>`;
    svg += `<circle class="hit" data-i="${i}" cx="${xFor(i)}" cy="${yFor(d.value)}" r="10" fill="transparent" style="cursor:pointer"/>`;
  });

  const last = SERIES[SERIES.length - 1];
  svg += `<text class="lbl" x="${xFor(SERIES.length - 1) + 10}" y="${yFor(last.value) + 4}" fill="var(--s1)">${money(last.value)}</text>`;

  document.getElementById('checkingSvg').innerHTML = svg;
  document.getElementById('checkingSvg').setAttribute('viewBox', `0 0 ${W} ${H}`);

  const tip = document.getElementById('tooltip');
  document.querySelectorAll('#checkingSvg .hit').forEach(el => {
    el.addEventListener('mouseenter', () => {
      const d = SERIES[+el.dataset.i];
      tip.innerHTML = `<div class="row"><span>${MONTH_LABELS[d.month]} ${d.year}</span><b style="margin-left:14px">${money(d.value)}</b></div>`;
      tip.classList.add('show');
    });
    el.addEventListener('mousemove', e => { tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; });
    el.addEventListener('mouseleave', () => tip.classList.remove('show'));
  });
})();
</script>
